# Generated by scripts/unify.py from observability.yaml, ecs-fargate.yaml and hud-access.yaml. Do not edit.
AWSTemplateFormatVersion: '2010-09-09'
Description: Hud OpenTelemetry collector on ECS Fargate plus the Observability Stack it writes to (OpenSearch Serverless, OpenSearch Ingestion, Amazon Managed Service for Prometheus, OpenSearch UI) and a read-only role Hud can assume to query it, in one stack.
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: Observability Stack
      Parameters:
      - Name
      - MinUnits
      - MaxUnits
      - ServiceMapWindow
    - Label:
        default: Where to run
      Parameters:
      - ClusterName
      - VpcId
      - SubnetIds
      - AssignPublicIp
      - AllowedCidr
    - Label:
        default: Collector
      Parameters:
      - Mode
      - ExportInterval
      - Cpu
      - Memory
      - CpuArchitecture
      - DesiredCount
      - Image
    - Label:
        default: Discovery
      Parameters:
      - DnsNamespace
    - Label:
        default: Hud access
      Parameters:
      - HudAccountId
      - HudPrincipalArn
      - ExternalId
Parameters:
  Name:
    Type: String
    Default: hud-obs
    AllowedPattern: ^[a-z][a-z0-9-]{2,27}$
    Description: Names the collection, pipeline, AMP workspace and UI application (3-28 lowercase characters).
  MinUnits:
    Type: Number
    Default: 1
    Description: Minimum OpenSearch Ingestion capacity (ICUs).
  MaxUnits:
    Type: Number
    Default: 4
  ServiceMapWindow:
    Type: String
    Default: 30s
  ClusterName:
    Type: String
    Description: Your existing ECS cluster to run the collector in.
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for the collector tasks. They need outbound internet (NAT or public IP) to pull the image and reach AMP.
  AssignPublicIp:
    Type: String
    Default: DISABLED
    AllowedValues:
    - DISABLED
    - ENABLED
  AllowedCidr:
    Type: String
    Description: CIDR of your apps that send metrics (usually your VPC CIDR). Opens port 4318 to it.
    AllowedPattern: ^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$
  Mode:
    Type: String
    Default: merge
    AllowedValues:
    - merge
    - convert
    Description: merge = one series per collector task (your apps must send deltas). convert = one series per app pod.
  ExportInterval:
    Type: String
    Default: 60s
    Description: How often merged totals are written (merge mode only).
  Cpu:
    Type: Number
    Default: 1024
    AllowedValues:
    - 512
    - 1024
    - 2048
    - 4096
  Memory:
    Type: Number
    Default: 4096
    Description: MiB. 4096 is recommended. Must be a valid Fargate size for the chosen Cpu.
  CpuArchitecture:
    Type: String
    Default: ARM64
    AllowedValues:
    - ARM64
    - X86_64
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
  Image:
    Type: String
    Default: ghcr.io/code-hud/hud-otel-collector:0.163.2-hud.2
    Description: Public image, or a copy in your account's ECR.
  DnsNamespace:
    Type: String
    Default: hud.local
    Description: Private DNS namespace created in your VPC. Your apps send to hud-collector.<namespace>:4318.
  HudAccountId:
    Type: String
    Default: '736129612463'
    AllowedPattern: ^\d{12}$
    Description: Hud's AWS account. Trusted as a whole unless HudPrincipalArn is set.
  HudPrincipalArn:
    Type: String
    Default: ''
    Description: Optional. A specific role in Hud's account to trust instead of the whole account.
  ExternalId:
    Type: String
    MinLength: 2
    MaxLength: 1224
    AllowedPattern: ^[\w+=,.@:/-]+$
    Description: The external id Hud gave you. Hud must send it when assuming the role.
Conditions:
  Merge: !Equals
  - !Ref 'Mode'
  - merge
  HasPrincipal: !Not
  - !Equals
    - !Ref 'HudPrincipalArn'
    - ''
Resources:
  EncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub '${Name}-enc'
      Type: encryption
      Policy: !Sub '{"Rules":[{"ResourceType":"collection","Resource":["collection/${Name}"]}],"AWSOwnedKey":true}'
  NetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub '${Name}-net'
      Type: network
      Policy: !Sub '[{"Rules":[{"ResourceType":"collection","Resource":["collection/${Name}"]},{"ResourceType":"dashboard","Resource":["collection/${Name}"]}],"AllowFromPublic":true}]'
  Collection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
    - EncryptionPolicy
    - NetworkPolicy
    Properties:
      Name: !Ref 'Name'
      Type: SEARCH
  Workspace:
    Type: AWS::APS::Workspace
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Alias: !Ref 'Name'
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: osis-pipelines.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: write
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - aoss:APIAccessAll
            - aoss:BatchGetCollection
            Resource: !GetAtt 'Collection.Arn'
          - Effect: Allow
            Action: aps:RemoteWrite
            Resource: !GetAtt 'Workspace.Arn'
  DataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub '${Name}-access'
      Type: data
      Policy: !Sub '[{"Rules":[ {"ResourceType":"index","Resource":["index/${Name}/*"],"Permission":["aoss:CreateIndex","aoss:UpdateIndex","aoss:DescribeIndex","aoss:ReadDocument","aoss:WriteDocument"]}, {"ResourceType":"collection","Resource":["collection/${Name}"],"Permission":["aoss:CreateCollectionItems","aoss:DeleteCollectionItems","aoss:UpdateCollectionItems","aoss:DescribeCollectionItems"]}], "Principal":["${PipelineRole.Arn}","arn:${AWS::Partition}:iam::${AWS::AccountId}:root"]}]'
  Pipeline:
    Type: AWS::OSIS::Pipeline
    DependsOn: DataAccessPolicy
    Properties:
      PipelineName: !Ref 'Name'
      MinUnits: !Ref 'MinUnits'
      MaxUnits: !Ref 'MaxUnits'
      PipelineRoleArn: !GetAtt 'PipelineRole.Arn'
      PipelineConfigurationBody: !Sub |
        version: '2'
        extension:
          osis_configuration_metadata:
            builder_type: visual

        # Main OTLP pipeline - receives all telemetry and routes by signal type
        otlp-pipeline:
          source:
            otlp:
              logs_path: '/${Name}/v1/logs'
              traces_path: '/${Name}/v1/traces'
              metrics_path: '/${Name}/v1/metrics'
          route:
            - logs: 'getEventType() == "LOG"'
            - traces: 'getEventType() == "TRACE"'
            - metrics: 'getEventType() == "METRIC"'
          processor: []
          sink:
            - pipeline:
                name: otel-logs-pipeline
                routes:
                  - logs
            - pipeline:
                name: otel-traces-pipeline
                routes:
                  - traces
            - pipeline:
                name: otel-metrics-pipeline
                routes:
                  - metrics

        # Log processing pipeline
        otel-logs-pipeline:
          source:
            pipeline:
              name: otlp-pipeline
          processor:
            - copy_values:
                entries:
                  - from_key: "time"
                    to_key: "@timestamp"
          sink:
            - opensearch:
                hosts:
                  - '${Collection.CollectionEndpoint}'
                index: 'logs-otel-v1'
                template_type: 'index-template'
                template_content: '{"version":1,"template":{"mappings":{"date_detection":false,"_source":{"enabled":true},"dynamic_templates":[{"long_resource_attributes":{"mapping":{"type":"long"},"path_match":"resource.attributes.*","match_mapping_type":"long"}},{"double_resource_attributes":{"mapping":{"type":"double"},"path_match":"resource.attributes.*","match_mapping_type":"double"}},{"string_resource_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"resource.attributes.*","match_mapping_type":"string"}},{"long_scope_attributes":{"mapping":{"type":"long"},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"long"}},{"double_scope_attributes":{"mapping":{"type":"double"},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"double"}},{"string_scope_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"string"}},{"long_attributes":{"mapping":{"type":"long"},"path_match":"attributes.*","match_mapping_type":"long"}},{"double_attributes":{"mapping":{"type":"double"},"path_match":"attributes.*","match_mapping_type":"double"}},{"string_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"attributes.*","match_mapping_type":"string"}}],"properties":{"droppedAttributesCount":{"type":"integer"},"instrumentationScope":{"properties":{"droppedAttributesCount":{"type":"integer"},"schemaUrl":{"type":"keyword","ignore_above":256},"name":{"type":"keyword","ignore_above":128},"version":{"type":"keyword","ignore_above":64}}},"resource":{"properties":{"droppedAttributesCount":{"type":"integer"},"schemaUrl":{"type":"keyword","ignore_above":256}}},"severity":{"properties":{"number":{"type":"integer"},"text":{"type":"keyword","ignore_above":32}}},"body":{"type":"text"},"@timestamp":{"type":"date_nanos"},"time":{"type":"date_nanos"},"observedTime":{"type":"date_nanos"},"traceId":{"type":"keyword","ignore_above":32},"spanId":{"type":"keyword","ignore_above":16},"flags":{"type":"long"}}}}}'
                aws:
                  serverless: true
                  region: '${AWS::Region}'
                  sts_role_arn: "${PipelineRole.Arn}"

        # Trace fan-out pipeline
        otel-traces-pipeline:
          source:
            pipeline:
              name: otlp-pipeline
          processor: []
          sink:
            - pipeline:
                name: traces-raw-pipeline
                routes: []
            - pipeline:
                name: service-map-pipeline
                routes: []

        # Raw trace storage pipeline
        traces-raw-pipeline:
          source:
            pipeline:
              name: otel-traces-pipeline
          processor:
            - otel_traces:
          sink:
            - opensearch:
                hosts:
                  - '${Collection.CollectionEndpoint}'
                index: 'otel-v1-apm-span'
                template_type: 'index-template'
                template_content: '{"version":1,"template":{"mappings":{"date_detection":false,"_source":{"enabled":true},"dynamic_templates":[{"long_resource_attributes":{"mapping":{"type":"long"},"path_match":"resource.attributes.*","match_mapping_type":"long"}},{"double_resource_attributes":{"mapping":{"type":"double"},"path_match":"resource.attributes.*","match_mapping_type":"double"}},{"string_resource_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"resource.attributes.*","match_mapping_type":"string"}},{"long_scope_attributes":{"mapping":{"type":"long"},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"long"}},{"double_scope_attributes":{"mapping":{"type":"double"},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"double"}},{"string_scope_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"string"}},{"long_attributes":{"mapping":{"type":"long"},"path_match":"attributes.*","match_mapping_type":"long"}},{"double_attributes":{"mapping":{"type":"double"},"path_match":"attributes.*","match_mapping_type":"double"}},{"string_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"attributes.*","match_mapping_type":"string"}}],"properties":{"droppedAttributesCount":{"type":"integer"},"instrumentationScope":{"properties":{"droppedAttributesCount":{"type":"integer"},"schemaUrl":{"type":"keyword","ignore_above":256},"name":{"type":"keyword","ignore_above":128},"version":{"type":"keyword","ignore_above":64}}},"resource":{"properties":{"droppedAttributesCount":{"type":"integer"},"schemaUrl":{"type":"keyword","ignore_above":256}}},"traceId":{"type":"keyword","ignore_above":32},"spanId":{"type":"keyword","ignore_above":16},"parentSpanId":{"type":"keyword","ignore_above":16},"name":{"ignore_above":1024,"type":"keyword"},"traceState":{"ignore_above":1024,"type":"keyword"},"traceGroup":{"ignore_above":1024,"type":"keyword"},"traceGroupFields":{"properties":{"endTime":{"type":"date_nanos"},"durationInNanos":{"type":"long"},"statusCode":{"type":"integer"}}},"kind":{"type":"keyword","ignore_above":32},"serviceName":{"type":"keyword","ignore_above":256},"startTime":{"type":"date_nanos"},"endTime":{"type":"date_nanos"},"@timestamp":{"type":"date_nanos"},"time":{"type":"date_nanos"},"status":{"properties":{"code":{"type":"integer"},"message":{"type":"keyword","ignore_above":2048}}},"durationInNanos":{"type":"long"},"events":{"type":"nested","properties":{"name":{"type":"keyword","ignore_above":256},"attributes":{"type":"object"},"droppedAttributesCount":{"type":"integer"},"time":{"type":"date_nanos"}}},"droppedEventsCount":{"type":"integer"},"links":{"type":"nested","properties":{"traceId":{"type":"keyword","ignore_above":32},"spanId":{"type":"keyword","ignore_above":16},"traceState":{"ignore_above":1024,"type":"keyword"},"attributes":{"type":"object"},"droppedAttributesCount":{"type":"integer"}}},"droppedLinksCount":{"type":"integer"}}}}}'
                aws:
                  serverless: true
                  region: '${AWS::Region}'
                  sts_role_arn: "${PipelineRole.Arn}"

        # Service map generation pipeline (APM)
        service-map-pipeline:
          source:
            pipeline:
              name: otel-traces-pipeline
          processor:
            - otel_apm_service_map:
                db_path: /tmp/otel-apm-service-map
                group_by_attributes:
                  - telemetry.sdk.language
                window_duration: ${ServiceMapWindow}
          route:
            - otel_apm_service_map_route: 'getEventType() == "SERVICE_MAP"'
            - service_processed_metrics: 'getEventType() == "METRIC"'
          sink:
            - opensearch:
                hosts:
                  - '${Collection.CollectionEndpoint}'
                aws:
                  serverless: true
                  region: '${AWS::Region}'
                  sts_role_arn: "${PipelineRole.Arn}"
                routes:
                  - otel_apm_service_map_route
                index: 'otel-v2-apm-service-map'
                template_type: 'index-template'
                template_content: '{"version":0,"template":{"mappings":{"date_detection":false,"dynamic_templates":[{"long_group_by_attributes":{"path_match":"*.groupByAttributes.*","match_mapping_type":"long","mapping":{"type":"long"}}},{"double_group_by_attributes":{"path_match":"*.groupByAttributes.*","match_mapping_type":"double","mapping":{"type":"double"}}},{"string_group_by_attributes":{"path_match":"*.groupByAttributes.*","match_mapping_type":"string","mapping":{"type":"keyword"}}},{"long_operation_attributes":{"path_match":"*.attributes.*","match_mapping_type":"long","mapping":{"type":"long"}}},{"double_operation_attributes":{"path_match":"*.attributes.*","match_mapping_type":"double","mapping":{"type":"double"}}},{"string_operation_attributes":{"path_match":"*.attributes.*","match_mapping_type":"string","mapping":{"type":"keyword"}}}],"_source":{"enabled":true},"properties":{"sourceNode":{"properties":{"type":{"type":"keyword"},"keyAttributes":{"properties":{"environment":{"type":"keyword"},"name":{"type":"keyword"}}},"groupByAttributes":{"type":"object","dynamic":"true"}}},"targetNode":{"properties":{"type":{"type":"keyword"},"keyAttributes":{"properties":{"environment":{"type":"keyword"},"name":{"type":"keyword"}}},"groupByAttributes":{"type":"object","dynamic":"true"}}},"sourceOperation":{"properties":{"name":{"type":"keyword"},"attributes":{"type":"object","dynamic":"true"}}},"targetOperation":{"properties":{"name":{"type":"keyword"},"attributes":{"type":"object","dynamic":"true"}}},"nodeConnectionHash":{"type":"keyword"},"operationConnectionHash":{"type":"keyword"},"timestamp":{"type":"date","format":"strict_date_optional_time||epoch_millis"}}}}}'
            - prometheus:
                url: 'https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${Workspace.WorkspaceId}/api/v1/remote_write'
                aws:
                  region: '${AWS::Region}'
                routes:
                  - service_processed_metrics

        # Metrics processing pipeline
        otel-metrics-pipeline:
          source:
            pipeline:
              name: otlp-pipeline
          processor:
            - otel_metrics:
          sink:
            - prometheus:
                url: 'https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${Workspace.WorkspaceId}/api/v1/remote_write'
                aws:
                  region: '${AWS::Region}'
  DirectQueryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: directquery.opensearchservice.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: amp
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: aps:*
            Resource:
            - !GetAtt 'Workspace.Arn'
            - !Sub 'arn:${AWS::Partition}:aps:${AWS::Region}:${AWS::AccountId}:rulegroupsnamespace/${Workspace.WorkspaceId}/*'
  Application:
    Type: AWS::OpenSearchService::Application
    Properties:
      Name: !Ref 'Name'
      DataSources:
      - DataSourceArn: !GetAtt 'Collection.Arn'
      AppConfigs:
      - Key: opensearchDashboards.dashboardAdmin.users
        Value: '["*"]'
      - Key: opensearchDashboards.dashboardAdmin.groups
        Value: '["*"]'
  SetupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
      - PolicyName: setup
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - es:*
            - opensearch:*
            - aoss:BatchGetCollection
            - aoss:APIAccessAll
            Resource: '*'
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt 'DirectQueryRole.Arn'
  SetupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Timeout: 900
      Role: !GetAtt 'SetupRole.Arn'
      Code:
        ZipFile: |
          import json, time, urllib.error, urllib.parse, urllib.request
          import boto3, botocore.session, cfnresponse
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest

          WORKSPACE = "Observability Stack"

          def ui(base, method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = AWSRequest(method=method, url=base + path, data=data,
                               headers={"Content-Type": "application/json", "osd-xsrf": "osd-fetch"})
              SigV4Auth(botocore.session.Session().get_credentials(), "opensearch", boto3.session.Session().region_name).add_auth(req)
              r = urllib.request.Request(base + path, data=data, method=method, headers=dict(req.headers))
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp:
                      return resp.status, json.loads(resp.read() or b"null")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:500]

          def find(base, path, key, tries=6):
              for _ in range(tries):
                  _, d = ui(base, "GET", path)
                  if isinstance(d, dict) and d.get(key):
                      return d[key]
                  time.sleep(10)
              return []

          def setup(p):
              os_ = boto3.client("opensearch")
              name = p["DataSourceName"]
              try:
                  os_.add_direct_query_data_source(DataSourceName=name, Description="AMP for the Observability Stack",
                      DataSourceType={"Prometheus": {"RoleArn": p["DirectQueryRoleArn"], "WorkspaceArn": p["WorkspaceArn"]}})
              except os_.exceptions.ResourceAlreadyExistsException:
                  pass
              dqs = os_.get_direct_query_data_source(DataSourceName=name)["DataSourceArn"]

              for _ in range(60):
                  app = os_.get_application(id=p["AppId"])
                  if app.get("endpoint"):
                      break
                  if app.get("status") == "FAILED":
                      raise RuntimeError("application FAILED")
                  time.sleep(10)
              else:
                  raise RuntimeError("timed out waiting for the application endpoint")
              os_.update_application(id=p["AppId"], dataSources=[{"dataSourceArn": p["CollectionArn"]}, {"dataSourceArn": dqs}])
              base = app["endpoint"] if app["endpoint"].startswith("https://") else "https://" + app["endpoint"]

              for _ in range(24):
                  if ui(base, "GET", "/api/status")[0] == 200:
                      break
                  time.sleep(5)
              ds = find(base, "/api/saved_objects/_find?type=data-source&per_page=10", "saved_objects")
              dc = find(base, "/api/saved_objects/_find?type=data-connection&per_page=10", "saved_objects")

              _, wl = ui(base, "POST", "/api/workspaces/_list", {})
              ws = next((w["id"] for w in (wl or {}).get("result", {}).get("workspaces", []) if w["name"] == WORKSPACE), None)
              if not ws:
                  _, r = ui(base, "POST", "/api/workspaces", {"attributes": {"name": WORKSPACE,
                      "description": "Logs, traces and metrics", "features": ["use-case-observability"]}})
                  ws = (r or {}).get("result", {}).get("id") if isinstance(r, dict) else None
                  if not ws:
                      raise RuntimeError("workspace creation failed: %s" % r)
              for kind, objs in (("data-source", ds), ("data-connection", dc)):
                  if objs:
                      ui(base, "POST", "/api/workspaces/_associate", {"workspaceId": ws, "savedObjects": [{"type": kind, "id": objs[0]["id"]}]})

              logs_schema = '{"otelLogs":{"timestamp":"time","traceId":"traceId","spanId":"spanId","serviceName":"resource.attributes.service.name"}}'
              patterns = [{"title": "logs-otel-v1*", "timeFieldName": "time", "signalType": "logs", "schemaMappings": logs_schema},
                          {"title": "otel-v1-apm-span*", "timeFieldName": "endTime", "signalType": "traces"},
                          {"title": "otel-v2-apm-service-map*", "timeFieldName": "timestamp"}]
              ids = {}
              for pat in patterns:
                  _, f = ui(base, "GET", "/w/%s/api/saved_objects/_find?type=index-pattern&search_fields=title&search=%s" % (ws, urllib.parse.quote(pat["title"])))
                  hit = next((o["id"] for o in (f or {}).get("saved_objects", []) if o["attributes"].get("title") == pat["title"]), None) if isinstance(f, dict) else None
                  if not hit:
                      _, r = ui(base, "POST", "/w/%s/api/saved_objects/index-pattern" % ws, {"attributes": pat,
                          "references": [{"id": ds[0]["id"], "name": "dataSource", "type": "data-source"}] if ds else []})
                      hit = r.get("id") if isinstance(r, dict) else None
                  ids[pat["title"]] = hit
              logs, spans, svcmap = ids["logs-otel-v1*"], ids["otel-v1-apm-span*"], ids["otel-v2-apm-service-map*"]
              ui(base, "POST", "/w/%s/api/opensearch-dashboards/settings" % ws, {"changes": {"defaultIndex": logs}})

              _, c = ui(base, "GET", "/w/%s/api/saved_objects/_find?type=correlations&per_page=50" % ws)
              have = [o["attributes"].get("correlationType", "") for o in (c or {}).get("saved_objects", [])] if isinstance(c, dict) else []
              if spans and logs and not any(t.startswith("trace-to-logs") for t in have):
                  ui(base, "POST", "/w/%s/api/saved_objects/correlations" % ws, {"attributes": {
                      "correlationType": "trace-to-logs-otel-v1-apm-span*", "title": "trace-to-logs_otel-v1-apm-span*", "version": "1.0.0",
                      "entities": [{"tracesDataset": {"id": "references[0].id"}}, {"logsDataset": {"id": "references[1].id"}}]},
                      "references": [{"name": "entities[0].index", "type": "index-pattern", "id": spans},
                                     {"name": "entities[1].index", "type": "index-pattern", "id": logs}]})
              if spans and svcmap and dc and not any(t.startswith("APM-Config") for t in have):
                  ui(base, "POST", "/w/%s/api/saved_objects/correlations" % ws, {"attributes": {
                      "correlationType": "APM-Config-" + ws, "title": "apm-config", "version": "1.0.0",
                      "entities": [{"tracesDataset": {"id": "references[0].id"}}, {"serviceMapDataset": {"id": "references[1].id"}},
                                   {"prometheusDataSource": {"id": "references[2].id"}}]},
                      "references": [{"name": "entities[0].index", "type": "index-pattern", "id": spans},
                                     {"name": "entities[1].index", "type": "index-pattern", "id": svcmap},
                                     {"name": "entities[2].dataConnection", "type": "data-connection", "id": dc[0]["id"]}]})
              ui(base, "POST", "/api/opensearch-dashboards/settings", {"changes": {"defaultWorkspace": ws}})
              return {"WorkspaceId": ws, "DataSourceArn": dqs, "Endpoint": base}

          def teardown(p):
              os_ = boto3.client("opensearch")
              try:
                  os_.update_application(id=p["AppId"], dataSources=[{"dataSourceArn": p["CollectionArn"]}])
              except Exception as e:
                  print("detach:", e)
              try:
                  os_.delete_direct_query_data_source(DataSourceName=p["DataSourceName"])
              except Exception as e:
                  print("delete data source:", e)

          def handler(event, context):
              p = event["ResourceProperties"]
              try:
                  if event["RequestType"] == "Delete":
                      teardown(p)
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, "setup")
                  else:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, setup(p), "setup")
              except Exception as e:
                  print("failed:", repr(e))
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, "setup", reason=str(e)[:200])
  Setup:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt 'SetupFunction.Arn'
      AppId: !GetAtt 'Application.Id'
      CollectionArn: !GetAtt 'Collection.Arn'
      WorkspaceArn: !GetAtt 'Workspace.Arn'
      DirectQueryRoleArn: !GetAtt 'DirectQueryRole.Arn'
      DataSourceName: !Join
      - _
      - - !Join
          - _
          - !Split
            - '-'
            - !Ref 'Name'
        - prometheus
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/hud/${AWS::StackName}'
      RetentionInDays: 14
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: amp-remote-write
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: aps:RemoteWrite
            Resource: !Sub 'arn:${AWS::Partition}:aps:${AWS::Region}:${AWS::AccountId}:workspace/${Workspace.WorkspaceId}'
      - PolicyName: osis-ingest
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: osis:Ingest
            Resource: !Sub 'arn:${AWS::Partition}:osis:${AWS::Region}:${AWS::AccountId}:pipeline/${Name}'
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hud collector OTLP/HTTP
      VpcId: !Ref 'VpcId'
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 4318
        ToPort: 4318
        CidrIp: !Ref 'AllowedCidr'
  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Ref 'DnsNamespace'
      Vpc: !Ref 'VpcId'
  DiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: hud-collector
      NamespaceId: !Ref 'Namespace'
      DnsConfig:
        DnsRecords:
        - Type: A
          TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}'
      RequiresCompatibilities:
      - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref 'Cpu'
      Memory: !Ref 'Memory'
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: !Ref 'CpuArchitecture'
      ExecutionRoleArn: !GetAtt 'ExecutionRole.Arn'
      TaskRoleArn: !GetAtt 'TaskRole.Arn'
      ContainerDefinitions:
      - Name: collector
        Image: !Ref 'Image'
        Essential: true
        Command:
        - --config
        - env:HUD_OTELCOL_CONFIG
        PortMappings:
        - ContainerPort: 4318
          Protocol: tcp
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref 'LogGroup'
            awslogs-region: !Ref 'AWS::Region'
            awslogs-stream-prefix: collector
        Environment:
        - Name: AMP_REMOTE_WRITE_URL
          Value: !Sub
          - https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${Ws}/api/v1/remote_write
          - Ws: !GetAtt 'Workspace.WorkspaceId'
        - Name: HUD_OTELCOL_CONFIG
          Value: !Sub
          - |
            extensions:
              health_check:
                endpoint: 0.0.0.0:13133
              sigv4auth:
                region: ${AWS::Region}
                service: aps
              ${OsisAuth}
            receivers:
              otlp:
                protocols:
                  http:
                    endpoint: 0.0.0.0:4318
            processors:
              memory_limiter:
                check_interval: 1s
                limit_percentage: 80
                spike_limit_percentage: 20
              batch:
              transform/collector_id:
                metric_statements:
                  - context: resource
                    statements: ['set(attributes["service.instance.id"], "${!env:HOSTNAME}")']
              transform/restamp:
                metric_statements:
                  - context: datapoint
                    statements: ['set(start_time, Now())', 'set(time, Now())']
              delta_to_cumulative:
                max_stale: 1h
              interval:
                interval: ${ExportInterval}
            exporters:
              prometheus_remote_write:
                endpoint: ${!env:AMP_REMOTE_WRITE_URL}
                auth:
                  authenticator: sigv4auth
              ${OsisExporter}
            service:
              extensions: ${Extensions}
              pipelines:
                metrics:
                  receivers: [otlp]
                  processors: ${Processors}
                  exporters: [prometheus_remote_write]
                ${LogsPipeline}
          - Processors: !If
            - Merge
            - '[memory_limiter, batch, transform/collector_id, transform/restamp, delta_to_cumulative, interval]'
            - '[memory_limiter, batch, delta_to_cumulative]'
            OsisAuth: !Sub 'sigv4auth/osis: {region: ''${AWS::Region}'', service: osis}'
            OsisExporter: !Sub
            - 'otlp_http/osis: {logs_endpoint: ''${OsisLogsUrl}'', auth: {authenticator: sigv4auth/osis}, compression: none}'
            - OsisLogsUrl: !Sub
              - https://${Host}/${Name}/v1/logs
              - Host: !Select
                - 0
                - !GetAtt 'Pipeline.IngestEndpointUrls'
            Extensions: '[health_check, sigv4auth, sigv4auth/osis]'
            LogsPipeline: 'logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_http/osis]}'
  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: hud-collector
      Cluster: !Ref 'ClusterName'
      LaunchType: FARGATE
      DesiredCount: !Ref 'DesiredCount'
      TaskDefinition: !Ref 'TaskDefinition'
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref 'AssignPublicIp'
          SecurityGroups:
          - !Ref 'SecurityGroup'
          Subnets: !Ref 'SubnetIds'
      ServiceRegistries:
      - RegistryArn: !GetAtt 'DiscoveryService.Arn'
  HudRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            AWS: !If
            - HasPrincipal
            - !Ref 'HudPrincipalArn'
            - !Sub 'arn:${AWS::Partition}:iam::${HudAccountId}:root'
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              sts:ExternalId: !Ref 'ExternalId'
      Policies:
      - PolicyName: amp-read
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - aps:QueryMetrics
            - aps:GetSeries
            - aps:GetLabels
            - aps:GetMetricMetadata
            Resource: !Sub 'arn:${AWS::Partition}:aps:${AWS::Region}:${AWS::AccountId}:workspace/${Workspace.WorkspaceId}'
      - PolicyName: opensearch-read
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: aoss:APIAccessAll
            Resource: !Sub 'arn:${AWS::Partition}:aoss:${AWS::Region}:${AWS::AccountId}:collection/*'
          - Effect: Allow
            Action: aoss:BatchGetCollection
            Resource: '*'
  HudDataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub '${Name}-hud'
      Type: data
      Policy: !Sub '[{"Rules":[ {"ResourceType":"index","Resource":["index/${Name}/*"],"Permission":["aoss:DescribeIndex","aoss:ReadDocument"]}, {"ResourceType":"collection","Resource":["collection/${Name}"],"Permission":["aoss:DescribeCollectionItems"]}], "Principal":["${HudRole.Arn}"]}]'
Outputs:
  OtlpEndpoint:
    Description: Set HUD_OTLP_ENDPOINT in your apps to this.
    Value: !Sub 'http://hud-collector.${DnsNamespace}:4318'
  OtlpTemporality:
    Description: Set HUD_OTLP_TEMPORALITY in your apps to this. The Hud SDK only sends deltas, which both modes accept.
    Value: delta
  Investigations:
    Description: Where Hud investigations go.
    Value: !Sub
    - https://${Host}/${Name}/v1/logs
    - Host: !Select
      - 0
      - !GetAtt 'Pipeline.IngestEndpointUrls'
  AmpWorkspaceId:
    Value: !GetAtt 'Workspace.WorkspaceId'
  AmpQueryUrl:
    Value: !Sub
    - https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${Ws}/api/v1/query
    - Ws: !GetAtt 'Workspace.WorkspaceId'
  HudRoleArn:
    Description: Give this to Hud, with HudExternalId.
    Value: !GetAtt 'HudRole.Arn'
  HudExternalId:
    Description: Give this to Hud, with HudRoleArn.
    Value: !Ref 'ExternalId'
  DashboardUrl:
    Description: OpenSearch UI, Observability workspace.
    Value: !Sub '${Setup.Endpoint}/w/${Setup.WorkspaceId}/app/home'
  ObservabilityOtlpEndpoint:
    Description: Base OTLP endpoint for other OTel collectors (append /v1/logs, /v1/traces or /v1/metrics; SigV4, service osis).
    Value: !Sub
    - https://${Host}/${Name}
    - Host: !Select
      - 0
      - !GetAtt 'Pipeline.IngestEndpointUrls'
