# Generated by scripts/unify.py from parts/observability-data.yaml, ecs-fargate.yaml, hud-access.yaml, parts/observability-attach.yaml. Do not edit.
AWSTemplateFormatVersion: '2010-09-09'
Description: 'For when you already run the Observability Stack: Hud''s own OpenSearch Serverless collection, OpenSearch Ingestion pipeline and AMP workspace (uniquely named, next to yours), the Hud OpenTelemetry collector on ECS Fargate, and a read-only role Hud can assume to query them. Optionally adds the collection and workspace to your OpenSearch UI application.'
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: Observability Stack
      Parameters:
      - NamePrefix
      - MinUnits
      - MaxUnits
      - ServiceMapWindow
    - Label:
        default: Where to run
      Parameters:
      - ClusterName
      - VpcId
      - SubnetIds
      - AssignPublicIp
      - AllowedCidr
    - Label:
        default: Collector
      Parameters:
      - Mode
      - ExportInterval
      - Cpu
      - Memory
      - CpuArchitecture
      - DesiredCount
      - Image
    - Label:
        default: Discovery
      Parameters:
      - DnsNamespace
    - Label:
        default: Hud access
      Parameters:
      - HudAccountId
      - HudPrincipalArn
      - ExternalId
    - Label:
        default: Your OpenSearch UI
      Parameters:
      - ExistingUiAppId
Parameters:
  NamePrefix:
    Type: String
    Default: hud
    AllowedPattern: ^[a-z][a-z0-9-]{2,15}$
    Description: Start of the collection, pipeline, AMP workspace and policy names. The stack adds a unique suffix, e.g. hud-1a2b3c4d (3-16 lowercase characters).
  MinUnits:
    Type: Number
    Default: 1
    Description: Minimum OpenSearch Ingestion capacity (ICUs).
  MaxUnits:
    Type: Number
    Default: 4
  ServiceMapWindow:
    Type: String
    Default: 30s
  ClusterName:
    Type: String
    Description: Your existing ECS cluster to run the collector in.
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for the collector tasks. They need outbound internet (NAT or public IP) to pull the image and reach AMP.
  AssignPublicIp:
    Type: String
    Default: DISABLED
    AllowedValues:
    - DISABLED
    - ENABLED
  AllowedCidr:
    Type: String
    Description: CIDR of your apps that send metrics (usually your VPC CIDR). Opens port 4318 to it.
    AllowedPattern: ^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$
  Mode:
    Type: String
    Default: merge
    AllowedValues:
    - merge
    - convert
    Description: merge = one series per collector task (your apps must send deltas). convert = one series per app pod.
  ExportInterval:
    Type: String
    Default: 60s
    Description: How often merged totals are written (merge mode only).
  Cpu:
    Type: Number
    Default: 1024
    AllowedValues:
    - 512
    - 1024
    - 2048
    - 4096
  Memory:
    Type: Number
    Default: 4096
    Description: MiB. 4096 is recommended. Must be a valid Fargate size for the chosen Cpu.
  CpuArchitecture:
    Type: String
    Default: ARM64
    AllowedValues:
    - ARM64
    - X86_64
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
  Image:
    Type: String
    Default: ghcr.io/code-hud/hud-otel-collector:0.163.2-hud.2
    Description: Public image, or a copy in your account's ECR.
  DnsNamespace:
    Type: String
    Default: hud.local
    Description: Private DNS namespace created in your VPC. Your apps send to hud-collector.<namespace>:4318.
  HudAccountId:
    Type: String
    Default: '736129612463'
    AllowedPattern: ^\d{12}$
    Description: Hud's AWS account. Trusted as a whole unless HudPrincipalArn is set.
  HudPrincipalArn:
    Type: String
    Default: ''
    Description: Optional. A specific role in Hud's account to trust instead of the whole account.
  ExternalId:
    Type: String
    MinLength: 2
    MaxLength: 1224
    AllowedPattern: ^[\w+=,.@:/-]+$
    Description: The external id Hud gave you. Hud must send it when assuming the role.
  ExistingUiAppId:
    Type: String
    Default: ''
    AllowedPattern: ^([a-z0-9]{3,30})?$
    Description: Optional. Id of your OpenSearch UI application to add Hud's collection and AMP workspace to as data sources. Empty to skip.
Conditions:
  Merge: !Equals
  - !Ref 'Mode'
  - merge
  HasPrincipal: !Not
  - !Equals
    - !Ref 'HudPrincipalArn'
    - ''
  AttachToUi: !Not
  - !Equals
    - !Ref 'ExistingUiAppId'
    - ''
Resources:
  EncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub
      - ${Name}-enc
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
      Type: encryption
      Policy: !Sub
      - '{"Rules":[{"ResourceType":"collection","Resource":["collection/${Name}"]}],"AWSOwnedKey":true}'
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
  NetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub
      - ${Name}-net
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
      Type: network
      Policy: !Sub
      - '[{"Rules":[{"ResourceType":"collection","Resource":["collection/${Name}"]},{"ResourceType":"dashboard","Resource":["collection/${Name}"]}],"AllowFromPublic":true}]'
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
  Collection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
    - EncryptionPolicy
    - NetworkPolicy
    Properties:
      Name: !Join
      - '-'
      - - !Ref 'NamePrefix'
        - !Select
          - 0
          - !Split
            - '-'
            - !Select
              - 2
              - !Split
                - /
                - !Ref 'AWS::StackId'
      Type: SEARCH
  Workspace:
    Type: AWS::APS::Workspace
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Alias: !Join
      - '-'
      - - !Ref 'NamePrefix'
        - !Select
          - 0
          - !Split
            - '-'
            - !Select
              - 2
              - !Split
                - /
                - !Ref 'AWS::StackId'
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: osis-pipelines.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: write
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - aoss:APIAccessAll
            - aoss:BatchGetCollection
            Resource: !GetAtt 'Collection.Arn'
          - Effect: Allow
            Action: aps:RemoteWrite
            Resource: !GetAtt 'Workspace.Arn'
  DataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub
      - ${Name}-access
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
      Type: data
      Policy: !Sub
      - '[{"Rules":[ {"ResourceType":"index","Resource":["index/${Name}/*"],"Permission":["aoss:CreateIndex","aoss:UpdateIndex","aoss:DescribeIndex","aoss:ReadDocument","aoss:WriteDocument"]}, {"ResourceType":"collection","Resource":["collection/${Name}"],"Permission":["aoss:CreateCollectionItems","aoss:DeleteCollectionItems","aoss:UpdateCollectionItems","aoss:DescribeCollectionItems"]}], "Principal":["${PipelineRole.Arn}","arn:${AWS::Partition}:iam::${AWS::AccountId}:root"]}]'
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
  Pipeline:
    Type: AWS::OSIS::Pipeline
    DependsOn: DataAccessPolicy
    Properties:
      PipelineName: !Join
      - '-'
      - - !Ref 'NamePrefix'
        - !Select
          - 0
          - !Split
            - '-'
            - !Select
              - 2
              - !Split
                - /
                - !Ref 'AWS::StackId'
      MinUnits: !Ref 'MinUnits'
      MaxUnits: !Ref 'MaxUnits'
      PipelineRoleArn: !GetAtt 'PipelineRole.Arn'
      PipelineConfigurationBody: !Sub
      - |
        version: '2'
        extension:
          osis_configuration_metadata:
            builder_type: visual

        # Main OTLP pipeline - receives all telemetry and routes by signal type
        otlp-pipeline:
          source:
            otlp:
              logs_path: '/${Name}/v1/logs'
              traces_path: '/${Name}/v1/traces'
              metrics_path: '/${Name}/v1/metrics'
          route:
            - logs: 'getEventType() == "LOG"'
            - traces: 'getEventType() == "TRACE"'
            - metrics: 'getEventType() == "METRIC"'
          processor: []
          sink:
            - pipeline:
                name: otel-logs-pipeline
                routes:
                  - logs
            - pipeline:
                name: otel-traces-pipeline
                routes:
                  - traces
            - pipeline:
                name: otel-metrics-pipeline
                routes:
                  - metrics

        # Log processing pipeline
        otel-logs-pipeline:
          source:
            pipeline:
              name: otlp-pipeline
          processor:
            - copy_values:
                entries:
                  - from_key: "time"
                    to_key: "@timestamp"
          sink:
            - opensearch:
                hosts:
                  - '${Collection.CollectionEndpoint}'
                index: 'logs-otel-v1'
                template_type: 'index-template'
                template_content: '{"version":1,"template":{"mappings":{"date_detection":false,"_source":{"enabled":true},"dynamic_templates":[{"long_resource_attributes":{"mapping":{"type":"long"},"path_match":"resource.attributes.*","match_mapping_type":"long"}},{"double_resource_attributes":{"mapping":{"type":"double"},"path_match":"resource.attributes.*","match_mapping_type":"double"}},{"string_resource_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"resource.attributes.*","match_mapping_type":"string"}},{"long_scope_attributes":{"mapping":{"type":"long"},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"long"}},{"double_scope_attributes":{"mapping":{"type":"double"},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"double"}},{"string_scope_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"string"}},{"long_attributes":{"mapping":{"type":"long"},"path_match":"attributes.*","match_mapping_type":"long"}},{"double_attributes":{"mapping":{"type":"double"},"path_match":"attributes.*","match_mapping_type":"double"}},{"string_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"attributes.*","match_mapping_type":"string"}}],"properties":{"droppedAttributesCount":{"type":"integer"},"instrumentationScope":{"properties":{"droppedAttributesCount":{"type":"integer"},"schemaUrl":{"type":"keyword","ignore_above":256},"name":{"type":"keyword","ignore_above":128},"version":{"type":"keyword","ignore_above":64}}},"resource":{"properties":{"droppedAttributesCount":{"type":"integer"},"schemaUrl":{"type":"keyword","ignore_above":256}}},"severity":{"properties":{"number":{"type":"integer"},"text":{"type":"keyword","ignore_above":32}}},"body":{"type":"text"},"@timestamp":{"type":"date_nanos"},"time":{"type":"date_nanos"},"observedTime":{"type":"date_nanos"},"traceId":{"type":"keyword","ignore_above":32},"spanId":{"type":"keyword","ignore_above":16},"flags":{"type":"long"}}}}}'
                aws:
                  serverless: true
                  region: '${AWS::Region}'
                  sts_role_arn: "${PipelineRole.Arn}"

        # Trace fan-out pipeline
        otel-traces-pipeline:
          source:
            pipeline:
              name: otlp-pipeline
          processor: []
          sink:
            - pipeline:
                name: traces-raw-pipeline
                routes: []
            - pipeline:
                name: service-map-pipeline
                routes: []

        # Raw trace storage pipeline
        traces-raw-pipeline:
          source:
            pipeline:
              name: otel-traces-pipeline
          processor:
            - otel_traces:
          sink:
            - opensearch:
                hosts:
                  - '${Collection.CollectionEndpoint}'
                index: 'otel-v1-apm-span'
                template_type: 'index-template'
                template_content: '{"version":1,"template":{"mappings":{"date_detection":false,"_source":{"enabled":true},"dynamic_templates":[{"long_resource_attributes":{"mapping":{"type":"long"},"path_match":"resource.attributes.*","match_mapping_type":"long"}},{"double_resource_attributes":{"mapping":{"type":"double"},"path_match":"resource.attributes.*","match_mapping_type":"double"}},{"string_resource_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"resource.attributes.*","match_mapping_type":"string"}},{"long_scope_attributes":{"mapping":{"type":"long"},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"long"}},{"double_scope_attributes":{"mapping":{"type":"double"},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"double"}},{"string_scope_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"string"}},{"long_attributes":{"mapping":{"type":"long"},"path_match":"attributes.*","match_mapping_type":"long"}},{"double_attributes":{"mapping":{"type":"double"},"path_match":"attributes.*","match_mapping_type":"double"}},{"string_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"attributes.*","match_mapping_type":"string"}}],"properties":{"droppedAttributesCount":{"type":"integer"},"instrumentationScope":{"properties":{"droppedAttributesCount":{"type":"integer"},"schemaUrl":{"type":"keyword","ignore_above":256},"name":{"type":"keyword","ignore_above":128},"version":{"type":"keyword","ignore_above":64}}},"resource":{"properties":{"droppedAttributesCount":{"type":"integer"},"schemaUrl":{"type":"keyword","ignore_above":256}}},"traceId":{"type":"keyword","ignore_above":32},"spanId":{"type":"keyword","ignore_above":16},"parentSpanId":{"type":"keyword","ignore_above":16},"name":{"ignore_above":1024,"type":"keyword"},"traceState":{"ignore_above":1024,"type":"keyword"},"traceGroup":{"ignore_above":1024,"type":"keyword"},"traceGroupFields":{"properties":{"endTime":{"type":"date_nanos"},"durationInNanos":{"type":"long"},"statusCode":{"type":"integer"}}},"kind":{"type":"keyword","ignore_above":32},"serviceName":{"type":"keyword","ignore_above":256},"startTime":{"type":"date_nanos"},"endTime":{"type":"date_nanos"},"@timestamp":{"type":"date_nanos"},"time":{"type":"date_nanos"},"status":{"properties":{"code":{"type":"integer"},"message":{"type":"keyword","ignore_above":2048}}},"durationInNanos":{"type":"long"},"events":{"type":"nested","properties":{"name":{"type":"keyword","ignore_above":256},"attributes":{"type":"object"},"droppedAttributesCount":{"type":"integer"},"time":{"type":"date_nanos"}}},"droppedEventsCount":{"type":"integer"},"links":{"type":"nested","properties":{"traceId":{"type":"keyword","ignore_above":32},"spanId":{"type":"keyword","ignore_above":16},"traceState":{"ignore_above":1024,"type":"keyword"},"attributes":{"type":"object"},"droppedAttributesCount":{"type":"integer"}}},"droppedLinksCount":{"type":"integer"}}}}}'
                aws:
                  serverless: true
                  region: '${AWS::Region}'
                  sts_role_arn: "${PipelineRole.Arn}"

        # Service map generation pipeline (APM)
        service-map-pipeline:
          source:
            pipeline:
              name: otel-traces-pipeline
          processor:
            - otel_apm_service_map:
                db_path: /tmp/otel-apm-service-map
                group_by_attributes:
                  - telemetry.sdk.language
                window_duration: ${ServiceMapWindow}
          route:
            - otel_apm_service_map_route: 'getEventType() == "SERVICE_MAP"'
            - service_processed_metrics: 'getEventType() == "METRIC"'
          sink:
            - opensearch:
                hosts:
                  - '${Collection.CollectionEndpoint}'
                aws:
                  serverless: true
                  region: '${AWS::Region}'
                  sts_role_arn: "${PipelineRole.Arn}"
                routes:
                  - otel_apm_service_map_route
                index: 'otel-v2-apm-service-map'
                template_type: 'index-template'
                template_content: '{"version":0,"template":{"mappings":{"date_detection":false,"dynamic_templates":[{"long_group_by_attributes":{"path_match":"*.groupByAttributes.*","match_mapping_type":"long","mapping":{"type":"long"}}},{"double_group_by_attributes":{"path_match":"*.groupByAttributes.*","match_mapping_type":"double","mapping":{"type":"double"}}},{"string_group_by_attributes":{"path_match":"*.groupByAttributes.*","match_mapping_type":"string","mapping":{"type":"keyword"}}},{"long_operation_attributes":{"path_match":"*.attributes.*","match_mapping_type":"long","mapping":{"type":"long"}}},{"double_operation_attributes":{"path_match":"*.attributes.*","match_mapping_type":"double","mapping":{"type":"double"}}},{"string_operation_attributes":{"path_match":"*.attributes.*","match_mapping_type":"string","mapping":{"type":"keyword"}}}],"_source":{"enabled":true},"properties":{"sourceNode":{"properties":{"type":{"type":"keyword"},"keyAttributes":{"properties":{"environment":{"type":"keyword"},"name":{"type":"keyword"}}},"groupByAttributes":{"type":"object","dynamic":"true"}}},"targetNode":{"properties":{"type":{"type":"keyword"},"keyAttributes":{"properties":{"environment":{"type":"keyword"},"name":{"type":"keyword"}}},"groupByAttributes":{"type":"object","dynamic":"true"}}},"sourceOperation":{"properties":{"name":{"type":"keyword"},"attributes":{"type":"object","dynamic":"true"}}},"targetOperation":{"properties":{"name":{"type":"keyword"},"attributes":{"type":"object","dynamic":"true"}}},"nodeConnectionHash":{"type":"keyword"},"operationConnectionHash":{"type":"keyword"},"timestamp":{"type":"date","format":"strict_date_optional_time||epoch_millis"}}}}}'
            - prometheus:
                url: 'https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${Workspace.WorkspaceId}/api/v1/remote_write'
                aws:
                  region: '${AWS::Region}'
                routes:
                  - service_processed_metrics

        # Metrics processing pipeline
        otel-metrics-pipeline:
          source:
            pipeline:
              name: otlp-pipeline
          processor:
            - otel_metrics:
          sink:
            - prometheus:
                url: 'https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${Workspace.WorkspaceId}/api/v1/remote_write'
                aws:
                  region: '${AWS::Region}'
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/hud/${AWS::StackName}'
      RetentionInDays: 14
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: amp-remote-write
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: aps:RemoteWrite
            Resource: !Sub 'arn:${AWS::Partition}:aps:${AWS::Region}:${AWS::AccountId}:workspace/${Workspace.WorkspaceId}'
      - PolicyName: osis-ingest
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: osis:Ingest
            Resource: !Sub
            - arn:${AWS::Partition}:osis:${AWS::Region}:${AWS::AccountId}:pipeline/${Name}
            - Name: !Join
              - '-'
              - - !Ref 'NamePrefix'
                - !Select
                  - 0
                  - !Split
                    - '-'
                    - !Select
                      - 2
                      - !Split
                        - /
                        - !Ref 'AWS::StackId'
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hud collector OTLP/HTTP
      VpcId: !Ref 'VpcId'
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 4318
        ToPort: 4318
        CidrIp: !Ref 'AllowedCidr'
  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Ref 'DnsNamespace'
      Vpc: !Ref 'VpcId'
  DiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: hud-collector
      NamespaceId: !Ref 'Namespace'
      DnsConfig:
        DnsRecords:
        - Type: A
          TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}'
      RequiresCompatibilities:
      - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref 'Cpu'
      Memory: !Ref 'Memory'
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: !Ref 'CpuArchitecture'
      ExecutionRoleArn: !GetAtt 'ExecutionRole.Arn'
      TaskRoleArn: !GetAtt 'TaskRole.Arn'
      ContainerDefinitions:
      - Name: collector
        Image: !Ref 'Image'
        Essential: true
        Command:
        - --config
        - env:HUD_OTELCOL_CONFIG
        PortMappings:
        - ContainerPort: 4318
          Protocol: tcp
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref 'LogGroup'
            awslogs-region: !Ref 'AWS::Region'
            awslogs-stream-prefix: collector
        Environment:
        - Name: AMP_REMOTE_WRITE_URL
          Value: !Sub
          - https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${Ws}/api/v1/remote_write
          - Ws: !GetAtt 'Workspace.WorkspaceId'
        - Name: HUD_OTELCOL_CONFIG
          Value: !Sub
          - |
            extensions:
              health_check:
                endpoint: 0.0.0.0:13133
              sigv4auth:
                region: ${AWS::Region}
                service: aps
              ${OsisAuth}
            receivers:
              otlp:
                protocols:
                  http:
                    endpoint: 0.0.0.0:4318
            processors:
              memory_limiter:
                check_interval: 1s
                limit_percentage: 80
                spike_limit_percentage: 20
              batch:
              transform/collector_id:
                metric_statements:
                  - context: resource
                    statements: ['set(attributes["service.instance.id"], "${!env:HOSTNAME}")']
              transform/restamp:
                metric_statements:
                  - context: datapoint
                    statements: ['set(start_time, Now())', 'set(time, Now())']
              delta_to_cumulative:
                max_stale: 1h
              interval:
                interval: ${ExportInterval}
            exporters:
              prometheus_remote_write:
                endpoint: ${!env:AMP_REMOTE_WRITE_URL}
                auth:
                  authenticator: sigv4auth
              ${OsisExporter}
            service:
              extensions: ${Extensions}
              pipelines:
                metrics:
                  receivers: [otlp]
                  processors: ${Processors}
                  exporters: [prometheus_remote_write]
                ${LogsPipeline}
          - Processors: !If
            - Merge
            - '[memory_limiter, batch, transform/collector_id, transform/restamp, delta_to_cumulative, interval]'
            - '[memory_limiter, batch, delta_to_cumulative]'
            OsisAuth: !Sub 'sigv4auth/osis: {region: ''${AWS::Region}'', service: osis}'
            OsisExporter: !Sub
            - 'otlp_http/osis: {logs_endpoint: ''${OsisLogsUrl}'', auth: {authenticator: sigv4auth/osis}, compression: none}'
            - OsisLogsUrl: !Sub
              - https://${Host}/${Name}/v1/logs
              - Host: !Select
                - 0
                - !GetAtt 'Pipeline.IngestEndpointUrls'
                Name: !Join
                - '-'
                - - !Ref 'NamePrefix'
                  - !Select
                    - 0
                    - !Split
                      - '-'
                      - !Select
                        - 2
                        - !Split
                          - /
                          - !Ref 'AWS::StackId'
            Extensions: '[health_check, sigv4auth, sigv4auth/osis]'
            LogsPipeline: 'logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_http/osis]}'
  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: hud-collector
      Cluster: !Ref 'ClusterName'
      LaunchType: FARGATE
      DesiredCount: !Ref 'DesiredCount'
      TaskDefinition: !Ref 'TaskDefinition'
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref 'AssignPublicIp'
          SecurityGroups:
          - !Ref 'SecurityGroup'
          Subnets: !Ref 'SubnetIds'
      ServiceRegistries:
      - RegistryArn: !GetAtt 'DiscoveryService.Arn'
  HudRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            AWS: !If
            - HasPrincipal
            - !Ref 'HudPrincipalArn'
            - !Sub 'arn:${AWS::Partition}:iam::${HudAccountId}:root'
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              sts:ExternalId: !Ref 'ExternalId'
      Policies:
      - PolicyName: amp-read
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - aps:QueryMetrics
            - aps:GetSeries
            - aps:GetLabels
            - aps:GetMetricMetadata
            Resource: !Sub 'arn:${AWS::Partition}:aps:${AWS::Region}:${AWS::AccountId}:workspace/${Workspace.WorkspaceId}'
      - PolicyName: opensearch-read
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: aoss:APIAccessAll
            Resource: !Sub 'arn:${AWS::Partition}:aoss:${AWS::Region}:${AWS::AccountId}:collection/*'
          - Effect: Allow
            Action: aoss:BatchGetCollection
            Resource: '*'
  HudDataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub
      - ${Name}-hud
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
      Type: data
      Policy: !Sub
      - '[{"Rules":[ {"ResourceType":"index","Resource":["index/${Name}/*"],"Permission":["aoss:DescribeIndex","aoss:ReadDocument"]}, {"ResourceType":"collection","Resource":["collection/${Name}"],"Permission":["aoss:DescribeCollectionItems"]}], "Principal":["${HudRole.Arn}"]}]'
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
  AttachDirectQueryRole:
    Type: AWS::IAM::Role
    Condition: AttachToUi
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: directquery.opensearchservice.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: amp
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: aps:*
            Resource:
            - !GetAtt 'Workspace.Arn'
            - !Sub 'arn:${AWS::Partition}:aps:${AWS::Region}:${AWS::AccountId}:rulegroupsnamespace/${Workspace.WorkspaceId}/*'
  AttachRole:
    Type: AWS::IAM::Role
    Condition: AttachToUi
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
      - PolicyName: attach
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - es:*
            - opensearch:*
            - aoss:BatchGetCollection
            - aoss:APIAccessAll
            Resource: '*'
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt 'AttachDirectQueryRole.Arn'
  AttachFunction:
    Type: AWS::Lambda::Function
    Condition: AttachToUi
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Timeout: 300
      Role: !GetAtt 'AttachRole.Arn'
      Code:
        ZipFile: |
          import boto3, cfnresponse

          # Per app, so moving the stack to another app can't delete the new app's data source.
          def dqs_name(p):
              return "%s_%s" % (p["DataSourceName"], p["AppId"])

          def ours(os_, p):
              arns = [p["CollectionArn"]]
              try:
                  arns.append(os_.get_direct_query_data_source(DataSourceName=dqs_name(p))["DataSourceArn"])
              except os_.exceptions.ResourceNotFoundException:
                  pass
              return arns

          def attach(p):
              os_ = boto3.client("opensearch")
              try:
                  os_.add_direct_query_data_source(DataSourceName=dqs_name(p), Description="AMP for Hud",
                      DataSourceType={"Prometheus": {"RoleArn": p["DirectQueryRoleArn"], "WorkspaceArn": p["WorkspaceArn"]}})
              except os_.exceptions.ResourceAlreadyExistsException:
                  pass
              current = os_.get_application(id=p["AppId"]).get("dataSources", [])
              have = {d["dataSourceArn"] for d in current}
              added = [{"dataSourceArn": a} for a in ours(os_, p) if a not in have]
              if added:
                  os_.update_application(id=p["AppId"], dataSources=current + added)

          def detach(p):
              os_ = boto3.client("opensearch")
              mine = set(ours(os_, p))
              try:
                  current = os_.get_application(id=p["AppId"]).get("dataSources", [])
                  kept = [d for d in current if d["dataSourceArn"] not in mine]
                  if len(kept) != len(current):
                      os_.update_application(id=p["AppId"], dataSources=kept)
              except os_.exceptions.ResourceNotFoundException:
                  pass
              try:
                  os_.delete_direct_query_data_source(DataSourceName=dqs_name(p))
              except os_.exceptions.ResourceNotFoundException:
                  pass

          # The physical id is the app id: pointing the stack at another app makes CloudFormation delete (detach) the old one.
          def handler(event, context):
              p = event["ResourceProperties"]
              try:
                  if event["RequestType"] == "Delete":
                      detach(p)
                  else:
                      attach(p)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, p["AppId"])
              except Exception as e:
                  print("failed:", repr(e))
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, event.get("PhysicalResourceId", p["AppId"]), reason=str(e)[:200])
  Attach:
    Type: AWS::CloudFormation::CustomResource
    Condition: AttachToUi
    Properties:
      ServiceToken: !GetAtt 'AttachFunction.Arn'
      AppId: !Ref 'ExistingUiAppId'
      CollectionArn: !GetAtt 'Collection.Arn'
      WorkspaceArn: !GetAtt 'Workspace.Arn'
      DirectQueryRoleArn: !GetAtt 'AttachDirectQueryRole.Arn'
      DataSourceName: !Join
      - _
      - - !Join
          - _
          - !Split
            - '-'
            - !Join
              - '-'
              - - !Ref 'NamePrefix'
                - !Select
                  - 0
                  - !Split
                    - '-'
                    - !Select
                      - 2
                      - !Split
                        - /
                        - !Ref 'AWS::StackId'
        - hud_prometheus
Outputs:
  OtlpEndpoint:
    Description: Set HUD_OTLP_ENDPOINT in your apps to this.
    Value: !Sub 'http://hud-collector.${DnsNamespace}:4318'
  OtlpTemporality:
    Description: Set HUD_OTLP_TEMPORALITY in your apps to this. The Hud SDK only sends deltas, which both modes accept.
    Value: delta
  Investigations:
    Description: Where Hud investigations go.
    Value: !Sub
    - https://${Host}/${Name}/v1/logs
    - Host: !Select
      - 0
      - !GetAtt 'Pipeline.IngestEndpointUrls'
      Name: !Join
      - '-'
      - - !Ref 'NamePrefix'
        - !Select
          - 0
          - !Split
            - '-'
            - !Select
              - 2
              - !Split
                - /
                - !Ref 'AWS::StackId'
  AmpWorkspaceId:
    Value: !GetAtt 'Workspace.WorkspaceId'
  AmpQueryUrl:
    Value: !Sub
    - https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${Ws}/api/v1/query
    - Ws: !GetAtt 'Workspace.WorkspaceId'
  HudRoleArn:
    Description: Give this to Hud, with HudExternalId.
    Value: !GetAtt 'HudRole.Arn'
  HudExternalId:
    Description: Give this to Hud, with HudRoleArn.
    Value: !Ref 'ExternalId'
  ObservabilityOtlpEndpoint:
    Description: Base OTLP endpoint for other OTel collectors (append /v1/logs, /v1/traces or /v1/metrics; SigV4, service osis).
    Value: !Sub
    - https://${Host}/${Name}
    - Host: !Select
      - 0
      - !GetAtt 'Pipeline.IngestEndpointUrls'
      Name: !Join
      - '-'
      - - !Ref 'NamePrefix'
        - !Select
          - 0
          - !Split
            - '-'
            - !Select
              - 2
              - !Split
                - /
                - !Ref 'AWS::StackId'
