AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Attaches an OpenSearch Serverless collection and an AMP workspace (as a PromQL data source) to your existing
  OpenSearch UI application (source for scripts/unify.py). Your app's other data sources are kept.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Your OpenSearch UI }
        Parameters: [ExistingUiAppId]

Parameters:
  Name:
    Type: String
    AllowedPattern: ^[a-z][a-z0-9-]{2,24}$
  CollectionArn:
    Type: String
  AmpWorkspaceArn:
    Type: String
  AmpWorkspaceId:
    Type: String
  ExistingUiAppId:
    Type: String
    Default: ""
    AllowedPattern: ^([a-z0-9]{3,30})?$
    Description: Optional. Id of your OpenSearch UI application to add Hud's collection and AMP workspace to as data sources. Empty to skip.

Conditions:
  AttachToUi: !Not [!Equals [!Ref ExistingUiAppId, ""]]

Resources:
  # Lets the UI query AMP with PromQL (also manages AMP alert rules and silences, hence aps:* on rule groups).
  AttachDirectQueryRole:
    Type: AWS::IAM::Role
    Condition: AttachToUi
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: directquery.opensearchservice.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: amp
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: aps:*
                Resource:
                  - !Ref AmpWorkspaceArn
                  - !Sub arn:${AWS::Partition}:aps:${AWS::Region}:${AWS::AccountId}:rulegroupsnamespace/${AmpWorkspaceId}/*

  AttachRole:
    Type: AWS::IAM::Role
    Condition: AttachToUi
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: attach
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ponytail: same broad actions as the UI part's Setup; scope to the app and data source ARNs once verified in a real deploy.
              - Effect: Allow
                Action: [es:*, opensearch:*, aoss:BatchGetCollection, aoss:APIAccessAll]
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt AttachDirectQueryRole.Arn

  # UpdateApplication takes the full dataSources list, so this merges into the app's current list and, on delete,
  # removes only the two entries it added. No workspace is created: you pick which of your workspaces gets them.
  AttachFunction:
    Type: AWS::Lambda::Function
    Condition: AttachToUi
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Timeout: 300
      Role: !GetAtt AttachRole.Arn
      Code:
        ZipFile: |
          import boto3, cfnresponse

          # Per app, so moving the stack to another app can't delete the new app's data source.
          def dqs_name(p):
              return "%s_%s" % (p["DataSourceName"], p["AppId"])

          def ours(os_, p):
              arns = [p["CollectionArn"]]
              try:
                  arns.append(os_.get_direct_query_data_source(DataSourceName=dqs_name(p))["DataSourceArn"])
              except os_.exceptions.ResourceNotFoundException:
                  pass
              return arns

          def attach(p):
              os_ = boto3.client("opensearch")
              try:
                  os_.add_direct_query_data_source(DataSourceName=dqs_name(p), Description="AMP for Hud",
                      DataSourceType={"Prometheus": {"RoleArn": p["DirectQueryRoleArn"], "WorkspaceArn": p["WorkspaceArn"]}})
              except os_.exceptions.ResourceAlreadyExistsException:
                  pass
              current = os_.get_application(id=p["AppId"]).get("dataSources", [])
              have = {d["dataSourceArn"] for d in current}
              added = [{"dataSourceArn": a} for a in ours(os_, p) if a not in have]
              if added:
                  os_.update_application(id=p["AppId"], dataSources=current + added)

          def detach(p):
              os_ = boto3.client("opensearch")
              mine = set(ours(os_, p))
              try:
                  current = os_.get_application(id=p["AppId"]).get("dataSources", [])
                  kept = [d for d in current if d["dataSourceArn"] not in mine]
                  if len(kept) != len(current):
                      os_.update_application(id=p["AppId"], dataSources=kept)
              except os_.exceptions.ResourceNotFoundException:
                  pass
              try:
                  os_.delete_direct_query_data_source(DataSourceName=dqs_name(p))
              except os_.exceptions.ResourceNotFoundException:
                  pass

          # The physical id is the app id: pointing the stack at another app makes CloudFormation delete (detach) the old one.
          def handler(event, context):
              p = event["ResourceProperties"]
              try:
                  if event["RequestType"] == "Delete":
                      detach(p)
                  else:
                      attach(p)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, p["AppId"])
              except Exception as e:
                  print("failed:", repr(e))
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, event.get("PhysicalResourceId", p["AppId"]), reason=str(e)[:200])

  Attach:
    Type: AWS::CloudFormation::CustomResource
    Condition: AttachToUi
    Properties:
      ServiceToken: !GetAtt AttachFunction.Arn
      AppId: !Ref ExistingUiAppId
      CollectionArn: !Ref CollectionArn
      WorkspaceArn: !Ref AmpWorkspaceArn
      DirectQueryRoleArn: !GetAtt AttachDirectQueryRole.Arn
      DataSourceName: !Join ["_", [!Join ["_", !Split ["-", !Ref Name]], hud_prometheus]]
