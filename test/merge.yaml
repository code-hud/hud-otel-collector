# The merge-mode pipelines of deploy/, exported to a local Prometheus: function metrics merge
# across pods, everything else stays per pod.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  filter/functions:
    metrics:
      metric: ['not IsMatch(name, "^code\\.function\\.")']
  filter/per_pod:
    metrics:
      metric: ['IsMatch(name, "^code\\.function\\.")']
  # Serializes concurrent pod requests: re-stamping and deltatocumulative aren't
  # atomic, so without it a point stamped earlier can land later and be dropped.
  batch:
  transform/merge:
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "deployment.environment.name", "deployment.id", "k8s.namespace.name", "cloud.provider", "cloud.region", "telemetry.sdk.name", "telemetry.sdk.language", "telemetry.sdk.version", "hud.identity.version"])
          - set(attributes["service.instance.id"], "${env:HOSTNAME}")
  transform/restamp:
    metric_statements:
      - context: datapoint
        statements: ['set(start_time, Now())', 'set(time, Now())']
  deltatocumulative:
    max_stale: 1h
  interval:
    interval: 2s

exporters:
  prometheusremotewrite:
    endpoint: ${env:REMOTE_WRITE_URL}

service:
  pipelines:
    metrics/functions:
      receivers: [otlp]
      processors: [filter/functions, batch, transform/merge, transform/restamp, deltatocumulative, interval]
      exporters: [prometheusremotewrite]
    metrics/per_pod:
      receivers: [otlp]
      processors: [filter/per_pod, batch, deltatocumulative]
      exporters: [prometheusremotewrite]
