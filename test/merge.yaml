# The merge-mode pipelines of hud-o11y-resources' deploy configs, exported to a local Prometheus: function metrics merge
# across pods, everything else stays per pod.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  filter/functions:
    metrics:
      metric: ['not IsMatch(name, "^code\\.function\\.")']
  filter/per_pod:
    metrics:
      metric: ['IsMatch(name, "^code\\.function\\.")']
  # Serializes concurrent pod requests: re-stamping and deltatocumulative aren't
  # atomic, so without it a point stamped earlier can land later and be dropped.
  batch:
  # The kept attributes move from the resource onto the data points, so they become labels and a
  # stream's identity is its label set; only job and instance stay on the resource.
  transform/merge:
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.namespace", "deployment.environment.name", "deployment.id", "k8s.namespace.name", "cloud.provider", "cloud.region"])
      - context: datapoint
        statements:
          - merge_maps(attributes, resource.attributes, "insert")
          - delete_matching_keys(attributes, "^service\\.(name|namespace)$")
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.namespace"])
          - set(attributes["service.instance.id"], "${env:HOSTNAME}")
  # Copies the environment, deployment, namespace and cloud onto per-pod data points; a missing or empty one adds no label.
  transform/environment:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["deployment.environment.name"], resource.attributes["deployment.environment.name"]) where resource.attributes["deployment.environment.name"] != nil and resource.attributes["deployment.environment.name"] != ""
          - set(attributes["deployment.id"], resource.attributes["deployment.id"]) where resource.attributes["deployment.id"] != nil and resource.attributes["deployment.id"] != ""
          - set(attributes["k8s.namespace.name"], resource.attributes["k8s.namespace.name"]) where resource.attributes["k8s.namespace.name"] != nil and resource.attributes["k8s.namespace.name"] != ""
          - set(attributes["cloud.provider"], resource.attributes["cloud.provider"]) where resource.attributes["cloud.provider"] != nil and resource.attributes["cloud.provider"] != ""
          - set(attributes["cloud.region"], resource.attributes["cloud.region"]) where resource.attributes["cloud.region"] != nil and resource.attributes["cloud.region"] != ""
  transform/restamp:
    metric_statements:
      - context: datapoint
        statements: ['set(start_time, Now())', 'set(time, Now())']
  deltatocumulative:
    max_stale: 1h
  interval:
    interval: 2s

exporters:
  prometheusremotewrite:
    endpoint: ${env:REMOTE_WRITE_URL}

service:
  pipelines:
    metrics/functions:
      receivers: [otlp]
      processors: [filter/functions, batch, transform/merge, transform/restamp, deltatocumulative, interval]
      exporters: [prometheusremotewrite]
    metrics/per_pod:
      receivers: [otlp]
      processors: [filter/per_pod, batch, transform/environment, deltatocumulative]
      exporters: [prometheusremotewrite]
