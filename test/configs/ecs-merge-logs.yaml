extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  sigv4auth:
    region: us-east-1
    service: aps
  sigv4auth/osis: {region: 'us-east-1', service: osis}
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  filter/functions:
    metrics:
      metric: ['not IsMatch(name, "^code\\.function\\.")']
  filter/per_pod:
    metrics:
      metric: ['IsMatch(name, "^code\\.function\\.")']
  batch:
  transform/merge:
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.namespace", "deployment.environment.name", "deployment.id", "k8s.namespace.name", "cloud.provider", "cloud.region", "telemetry.sdk.version", "hud.identity.version"])
      - context: datapoint
        statements:
          - merge_maps(attributes, resource.attributes, "insert")
          - delete_matching_keys(attributes, "^service\\.(name|namespace)$")
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.namespace"])
          - set(attributes["service.instance.id"], "${env:HOSTNAME}")
  transform/restamp:
    metric_statements:
      - context: datapoint
        statements: ['set(start_time, Now())', 'set(time, Now())']
  delta_to_cumulative:
    max_stale: 1h
  interval:
    interval: 300s
exporters:
  prometheus_remote_write:
    endpoint: ${env:AMP_REMOTE_WRITE_URL}
    auth:
      authenticator: sigv4auth
  otlp_http/osis: {logs_endpoint: 'https://p.us-east-1.osis.amazonaws.com/p/v1/logs', auth: {authenticator: sigv4auth/osis}, compression: none}
service:
  extensions: [health_check, sigv4auth, sigv4auth/osis]
  pipelines:
    metrics/functions: {receivers: [otlp], processors: [memory_limiter, filter/functions, batch, transform/merge, transform/restamp, delta_to_cumulative, interval], exporters: [prometheus_remote_write]}
    metrics/per_pod: {receivers: [otlp], processors: [memory_limiter, filter/per_pod, batch, delta_to_cumulative], exporters: [prometheus_remote_write]}
    logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_http/osis]}
