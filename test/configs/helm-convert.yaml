exporters:
  prometheus_remote_write:
    auth:
      authenticator: sigv4auth
    endpoint: ${env:AMP_REMOTE_WRITE_URL}
extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133
  sigv4auth:
    region: ${env:AWS_REGION}
    service: aps
processors:
  batch: {}
  delta_to_cumulative:
    max_stale: 1h
  filter/functions:
    metrics:
      metric:
      - not IsMatch(name, "^code\\.function\\.")
  filter/per_pod:
    metrics:
      metric:
      - IsMatch(name, "^code\\.function\\.")
  interval:
    interval: 60s
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  transform/merge:
    metric_statements:
    - context: resource
      statements:
      - keep_keys(attributes, ["service.name", "service.namespace", "deployment.environment.name",
        "deployment.id", "k8s.namespace.name", "cloud.provider", "cloud.region", "telemetry.sdk.version",
        "hud.identity.version"])
    - context: datapoint
      statements:
      - merge_maps(attributes, resource.attributes, "insert")
      - delete_matching_keys(attributes, "^service\\.(name|namespace)$")
    - context: resource
      statements:
      - keep_keys(attributes, ["service.name", "service.namespace"])
      - set(attributes["service.instance.id"], "${env:HOSTNAME}")
  transform/restamp:
    metric_statements:
    - context: datapoint
      statements:
      - set(start_time, Now())
      - set(time, Now())
receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:MY_POD_IP}:4318
service:
  extensions:
  - health_check
  - sigv4auth
  pipelines:
    metrics/functions:
      exporters:
      - prometheus_remote_write
      processors:
      - memory_limiter
      - filter/functions
      - batch
      - delta_to_cumulative
      receivers:
      - otlp
    metrics/per_pod:
      exporters:
      - prometheus_remote_write
      processors:
      - memory_limiter
      - filter/per_pod
      - batch
      - delta_to_cumulative
      receivers:
      - otlp

