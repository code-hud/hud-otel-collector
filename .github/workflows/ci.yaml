name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make smoke
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hud-otelcol:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
