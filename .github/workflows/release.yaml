name: release

# A merged manifest version bump releases automatically (tags pushed with
# GITHUB_TOKEN can't trigger workflows, so tagging happens here).
# For a rebuild of the same version, push a tag like v0.163.2-hud.1.
on:
  push:
    branches: [main]
    paths: [manifest.yaml]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag the manifest version
        if: github.ref_type == 'branch'
        id: tag
        run: |
          tag=v$(awk '$1 == "version:" {print $2; exit}' manifest.yaml)
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already released"; echo "skip=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          git tag "$tag" && git push origin "$tag"

      - if: steps.tag.outputs.skip != 'true'
        run: echo "OCB_VERSION=$(awk '/collector\/receiver\/otlpreceiver/ {print $4}' manifest.yaml)" >>"$GITHUB_ENV"
      - if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - if: steps.tag.outputs.skip != 'true'
        uses: sigstore/cosign-installer@v4.1.2
      - if: steps.tag.outputs.skip != 'true'
        uses: anchore/sbom-action/download-syft@v0.24.3
      - if: steps.tag.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.tag.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.tag.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # hud-o11y-resources opens a PR bumping its deploy configs to the new image version.
      - name: Notify hud-o11y-resources
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.O11Y_RESOURCES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::O11Y_RESOURCES_TOKEN is not set, skipping"; exit 0; fi
          version=$(git describe --tags --exact-match)
          gh api repos/code-hud/hud-o11y-resources/dispatches -f event_type=collector-release \
            -f "client_payload[version]=${version#v}"
